name: Оновити випуски з YouTube

on:
  schedule:
    - cron: "17 */6 * * *"   # кожні 6 годин
  workflow_dispatch:          # кнопка Run workflow у вкладці Actions

permissions:
  contents: write

concurrency:
  group: update-episodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Оновити блок «Нові випуски на YouTube»
        run: python3 scripts/update_episodes.py

      - name: Закомітити зміни, якщо є
        run: |
          if git diff --quiet; then
            echo "Змін немає."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Оновлено випуски з YouTube"
          git push origin HEAD:main
